name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
